server {
    listen 80;
    server_name aihealthtips.org www.aihealthtips.org;

    client_max_body_size 50m;

    location /static/ {
        alias /var/www/myhealthpredicta/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /var/www/myhealthpredicta/media/;
        access_log off;
        expires 7d;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/myhealthpredicta/gunicorn.sock;
        proxy_read_timeout 120;
        proxy_connect_timeout 120;
        proxy_send_timeout 120;
    }
}
